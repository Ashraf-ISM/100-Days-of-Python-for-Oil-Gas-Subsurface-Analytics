name: "Feature request"
description: "Suggest an idea or enhancement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for sharing your idea."
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
      placeholder: It would help if...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternatives or workarounds?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or examples.
